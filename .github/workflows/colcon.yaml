name: Colcon Build Test
on:
  push:
    branches:
    - 'rolling'
    - 'jazzy'
    - 'iron'
    - 'humble'
  pull_request:
    branches:
    - '*'
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - {rosdistro: 'lyrical', ros_repo: 'main', skip_keys: ''}
          # octomap_rviz_plugins and octomap_server have no Rolling binary on Ubuntu 26.04 yet.
          - {rosdistro: 'rolling', ros_repo: 'testing', skip_keys: 'octomap_rviz_plugins octomap_server'}
    container:
      image: ros:${{ matrix.config.rosdistro }}-ros-base-resolute
    steps:
    - uses: actions/checkout@v4
      with:
        path: src/grid_map
    - name: Use the ROS testing repository
      run: |
        sed -i 's|packages.ros.org/ros2/ubuntu|packages.ros.org/ros2-testing/ubuntu|' /etc/apt/sources.list.d/*
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get -y dist-upgrade
      shell: bash
      if: ${{ matrix.config.ros_repo == 'testing' }}
    - name: Pull in repos with vcs
      run: |
        apt-get update
        vcs import --shallow --skip-existing --input grid_map/tools/ros2_dependencies.repos
      shell: bash
      working-directory: src
      if: ${{ matrix.config.rosdistro == 'rolling' }}
    - name: Install Dependencies with Rosdep
      run: |
        apt-get update
        rosdep update --rosdistro ${{matrix.config.rosdistro}}
        source /opt/ros/${{matrix.config.rosdistro}}/setup.bash
        rosdep install --from-paths $(colcon list --packages-up-to grid_map --paths-only) --ignore-src -y --rosdistro ${{matrix.config.rosdistro}} --skip-keys "${{matrix.config.skip_keys}}"
      shell: bash
    - name: Colcon Build (Release)
      run: |
        source /opt/ros/${{matrix.config.rosdistro}}/setup.bash
        colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release --packages-up-to grid_map
      shell: bash
    - name: Test
      run: |
        source /opt/ros/${{matrix.config.rosdistro}}/setup.bash
        source install/setup.bash
        colcon test --paths src/grid_map/* --event-handlers=console_cohesion+
        colcon test-result --all --verbose
      shell: bash

